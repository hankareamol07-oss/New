name: Build School App APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'zpschool_kuchi/app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: 'stable'
          cache: true

      - name: Remove Windows-only JDK path (breaks Linux builds)
        run: sed -i '/org.gradle.java.home/d' zpschool_kuchi/app/android/gradle.properties || true

      - name: Build release APK
        working-directory: zpschool_kuchi/app
        run: |
          flutter pub get
          flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: zpschool-kuchi-app-apk
          path: zpschool_kuchi/app/build/app/outputs/flutter-apk/app-release.apk
