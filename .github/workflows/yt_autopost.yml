name: YT autopost (2 syllabus videos a day)

# Every day: make the next 2 chapters with yt_studio/auto.py and upload them to YouTube, scheduled for the
# times in yt_studio/autopost.config.json (09:00 and 18:00 IST). Progress is kept on the autopost-state branch.
# Secrets: YOUTUBE_TOKEN_JSON (from GET_YOUTUBE_TOKEN.bat) + at least one of GEMINI_API_KEY / GROQ_API_KEY / NVIDIA_API_KEY.
on:
  schedule:
    - cron: "30 0 * * *"      # 06:00 IST
  workflow_dispatch:
    inputs:
      count:
        description: "videos to make"
        default: "2"
      upload:
        description: "upload to YouTube"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: yt-autopost
  cancel-in-progress: false

env:
  APP_BRANCH: devin/1790444372-yt-studio

jobs:
  autopost:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == github.event.repository.default_branch && env.APP_BRANCH || github.ref }}
          sparse-checkout: |
            yt_studio
            yt_common
            exam_paper/data/book_questions.json
            exam_paper/data/typed_questions.json
          sparse-checkout-cone-mode: false
          filter: blob:none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: yt_studio/requirements.txt
      - name: Install
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg libraqm0 libfribidi0
          pip install -q -r yt_studio/requirements.txt
          python -c "from PIL import features; assert features.check('raqm'), 'Pillow raqm missing (Marathi text)'"
      - name: Restore progress
        run: |
          if git fetch -q origin autopost-state; then
            git show FETCH_HEAD:auto_state.json > yt_studio/auto_state.json 2>/dev/null || true
            git show FETCH_HEAD:schedule_state.json > yt_studio/schedule_state.json 2>/dev/null || true
          fi
          cp yt_studio/autopost.config.json yt_studio/config.json
      - name: Make and upload
        working-directory: yt_studio
        env:
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          COUNT: ${{ inputs.count || '2' }}
          UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
        run: |
          if [ "$UPLOAD" = "true" ] && [ -z "$YOUTUBE_TOKEN_JSON" ]; then
            echo "::error::Secret YOUTUBE_TOKEN_JSON is missing - run GET_YOUTUBE_TOKEN.bat (README section 0b)"; exit 2
          fi
          if [ "$UPLOAD" = "true" ]; then python auto.py --count "$COUNT"; else python auto.py --count "$COUNT" --no-upload; fi
      - name: Save progress
        if: always()
        run: |
          d=$(mktemp -d); cd "$d"; git init -q
          git -c user.name=autopost -c user.email=autopost@users.noreply.github.com checkout -q -b autopost-state
          for f in auto_state.json schedule_state.json; do [ -f "$GITHUB_WORKSPACE/yt_studio/$f" ] && cp "$GITHUB_WORKSPACE/yt_studio/$f" .; done
          ls *.json >/dev/null 2>&1 || exit 0
          git add *.json
          git -c user.name=autopost -c user.email=autopost@users.noreply.github.com commit -q -m "autopost progress $(date -u +%F)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" autopost-state
      - name: Keep videos for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: videos
          retention-days: 3
          if-no-files-found: ignore
          path: |
            yt_studio/output/*/video.mp4
            yt_studio/output/*/short.mp4
            yt_studio/output/*/thumbnail.png
            yt_studio/output/*/youtube_description.txt
